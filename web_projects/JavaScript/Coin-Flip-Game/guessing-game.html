<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                background-color: black;
            }
           h1{
            color: white;
           }
           p{
            color: white;
           }
        </style>
    </head>
    <body>
        <h1>Coin Flip Guess Game</h1>
        <button onclick="
        playGuess('Heads')
        ">Heads</button>
        <button onclick="
        playGuess('Tails')
        ">Tails</button>
        <p class="js-coin"></p>
        <p class="js-result"></p>
        <p class="js-score"></p>
        <button onclick="
        score={
                wins: 0,
                loses: 0,
            }
            updateScore();
            
        ">Reset Score</button>

        <script>
            let score=JSON.parse(localStorage.getItem('score')) || {
                wins: 0,
                loses: 0,
            }
            function playGuess(playerGuess){
                let compGuess=Math.random();
                let result='';
                if (compGuess>0 && compGuess<1/2){
                    compGuess='Heads';
                } else if(compGuess>1/2 && compGuess<1){
                    compGuess='Tails';
                }
            if (playerGuess===compGuess){
                result="You win";
            } else{
                result="You lose";
            }
            if (result==="You win"){
                score.wins+=1;
            } else if (result==="You lose"){
                score.loses+=1;
            }
            localStorage.setItem('score',JSON.stringify(score));
            document.querySelector('.js-coin').innerHTML= `the coin is ${compGuess}`;
            document.querySelector('.js-result').innerHTML= `you guess ${playerGuess}. ${result}`;
            updateScore();
            } 
        function updateScore(){
            document.querySelector('.js-score').innerHTML= `Wins: ${score.wins}, Loses: ${score.loses}`;
        }
        </script>
    </body>
</html>

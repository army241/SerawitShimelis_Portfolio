<!DOCTYPE html>
<html>
    <head>
        <style>
            
            body{
                background-color: #050101e1;
                box-sizing: border-box;
            }
            button{
                background-color: #050101e1;
                margin-left: 40px;
                border-radius: 50%;
                width: 150px;
                height: 150px;
                border: 3px solid white;
                
                
            }
            .choice1::after{
                content: "✊";
                font-size: 60px;
                
                }
           
            .choice2::before{
                content: "✋";
                font-size: 60px;
                
                }
            
            .choice3::after{
                content: "✌️";
                font-size: 60px;
                
                }
               
            h1{
                color: white;
                margin-left: 20px;
                margin-top: 70px;
                margin-bottom: 70px;
            }
            .reset{
                color: white;
                font-size: 20px;
                border-radius: 1%;
                display: block;
                margin-top: 30px;
                width: 150px;
                height: 50px;
            }
        </style>
    </head>
    <body>
        <h1>Rock Paper Scissors Game</h1>
        <button class="choice1" onclick="
            playGame('rock');
        "></button>

        <button class="choice2" onclick="
                playGame('paper');
            "></button>

        <button class="choice3" onclick="
            playGame('scissors');
        "></button>
        
        <button onclick="
        score.wins=0;
        score.loses=0;
        score.ties=0;
        localStorage.removeItem('score');
        " class="reset">Reset score</button>
        <script>
            let score=JSON.parse(localStorage.getItem('score')) || {
                    wins: 0,
                    loses: 0,
                    ties: 0,
                };
                /*
            if (score===null){
                score={
                    wins: 0,
                    loses: 0,
                    ties: 0,
                }
            }
                    */
            
            console.log(localStorage.getItem('score'));
            function pickCompMove(){
                let randomNum=Math.random();
                let compMove='';
                if (randomNum>0 && randomNum<1/3){
                    compMove='rock';
                    
                } else if (randomNum>2/3 && randomNum<1){
                    compMove='paper';
                    
                } else if (randomNum>1/3 && randomNum<2/3){
                    compMove='scissors';
                    
                }
                return compMove;
            }

            function playGame(playerMove){
                let compMove=pickCompMove();
                let result='';
                if (playerMove==="rock"){
                        if (compMove==='rock'){
                            result=" Tie.";
                    } else if (compMove==='paper'){
                        result=" You lose.";
                    } else if (compMove==='scissors'){
                        result=" You win.";
                    }
                } else if (playerMove==="paper") {
                        if (compMove==='rock'){
                            result=" You win.";
                    } else if (compMove==='paper'){
                        result=" Tie.";
                    } else if (compMove==='scissors'){
                        result=" You lose.";
                    }
                } else if (playerMove==="scissors"){
                        if (compMove==='rock'){
                            result=" You lose.";
                    } else if (compMove==='paper'){
                        result=" You win.";
                    } else if (compMove==='scissors'){
                        result=" Tie.";
                    }
                }
            if (result===" You win."){
                score.wins+=1
            } else if (result===" You lose."){
                score.loses+=1
            } else if (result===" Tie."){
                score.ties+=1
            };
            localStorage.setItem('score',JSON.stringify(score));

            alert(`You picked ${playerMove}. Computer picked ${compMove}. ${result}\nWins: ${score.wins}, loses: ${score.loses}, ties: ${score.ties}`)
            }
        </script>
    </body>
</html>

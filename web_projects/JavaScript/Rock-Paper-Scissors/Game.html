<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="Game_styles.css">
    </head>
    <body>
        <h1>Rock Paper Scissors Game</h1>
        <h2>Pick Your Choice</h2>
        <button class="choice1" onclick="
            playGame('rock');
        "><img src="rock.png"></button>

        <button class="choice2" onclick="
                playGame('paper');
            "><img src="paper.png"></button>

        <button class="choice3" onclick="
            playGame('scissors');
        "><img src="scissors.png"></button>
        <p class="js-move move"></p>
        <p class="js-result"></p>       
        <p class="js-score"></p>
        <button onclick="
        score.wins=0;
        score.loses=0;
        score.ties=0;
        localStorage.removeItem('score');
        updateScore();
        " class="reset">Reset score</button>
        <script src="Game.js"></script>
    </body>
</html>

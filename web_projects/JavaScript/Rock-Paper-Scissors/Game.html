<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                background-color: #050101e1;
            }
            .choice1{
                width: 100px;
                height: 100px;
                border-radius: 50%;
                margin: 20px 10px;
            }
            .choice1::after{
                content: "🥳";
                
                }
                .choice2{
                width: 100px;
                height: 100px;
                border-radius: 50%;
                margin: 20px 10px;
            }
            .choice2::after{
                content: "🥳";
                
                }
                .choice3{
                width: 100px;
                height: 100px;
                border-radius: 50%;
                margin: 20px 10px;
            }
            .choice3::after{
                content: "🥳";
                
                }
                div{
                    background-color: grey;
                    width: 180px;
                    height: 40px;
                    padding-left: 5px;
                    padding-top: 19px;
                    margin: 10px 100px;
                    border-radius: 20%;
                }
                div:hover{
                    background-color: rgb(144, 129, 129);
                    transform: scale(1.2);
                    transition: 1s;
                }
        </style>
    </head>
    <body>
        <div>Rock Paper Scissors Game</div>
        <button class="choice1" onclick="
            playGame('rock');
        "></button>

        <button class="choice2" onclick="
                playGame('paper');
            "></button>

        <button class="choice3" onclick="
            playGame('scissors');
        "></button>

        <script>
            function pickCompMove(){
                let randomNum=Math.random();
                let compMove='';
                if (randomNum>0 && randomNum<1/3){
                    compMove='rock';
                    
                } else if (randomNum>2/3 && randomNum<1){
                    compMove='paper';
                    
                } else if (randomNum>1/3 && randomNum<2/3){
                    compMove='scissors';
                    
                }
                return compMove;
            }

            function playGame(playerMove){
                let compMove=pickCompMove();
                if (playerMove==="rock"){
                        if (compMove==='rock'){
                            alert(`You picked rock. Computer picked ${compMove}. its tie`)
                    } else if (compMove==='paper'){
                        alert(`You picked rock. Computer picked ${compMove}. you lose`)
                    } else if (compMove==='scissors'){
                        alert(`You picked rock. Computer picked ${compMove}. you win`)
                    }
                } else if (playerMove==="paper") {
                        if (compMove==='rock'){
                            alert(`You picked paper. Computer picked ${compMove}. you win`)
                    } else if (compMove==='paper'){
                        alert(`You picked paper. Computer picked ${compMove}. its a tie`)
                    } else if (compMove==='scissors'){
                        alert(`You picked paper. Computer picked ${compMove}. you lose`)
                    }
                } else if (playerMove==="scissors"){
                        if (compMove==='rock'){
                            alert(`You picked scissors. Computer picked ${compMove}. you lose`)
                    } else if (compMove==='paper'){
                        alert(`You picked scissors. Computer picked ${compMove}. you win`)
                    } else if (compMove==='scissors'){
                        alert(`You picked scissors. Computer picked ${compMove}. its a tie`)
                    }
                }
        
            }
        </script>
    </body>
</html>

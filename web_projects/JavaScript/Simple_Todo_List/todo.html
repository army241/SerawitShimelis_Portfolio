<!DOCTYPE html>
<html>
    <head>
        <style>
        </style>
    </head>
    <body>
        <h2>Todo List</h2>
        <hr>
        <input placeholder="to do name" class="js-todo-name">
        <button onclick="
        addTodo();
        " >Add</button>
        <div class="js-todo-list"></div>
        <script>
            const todoList=[];
            renderTodo()
            function renderTodo(){
                let inputHtml ='';
                for (let i=0;i<todoList.length;i++){
                    const todo=todoList[i];
                    const html=`<p>${todo}</p>`;
                    inputHtml+=html;
                }
                
                document.querySelector('.js-todo-list').innerHTML= inputHtml;
            }
            
            
            function addTodo(){
                let inputElement=document.querySelector('.js-todo-name');
                let name=inputElement.value;
                todoList.push(name);
                console.log(todoList);
                inputElement.value='';
                renderTodo()
            }
        </script>
    </body>
</html>
